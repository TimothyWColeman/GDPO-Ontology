name: Validate GDPO

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gdpo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install ROBOT with HermiT
        shell: bash
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar -o "$RUNNER_TEMP/robot.jar"
          echo "16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105  $RUNNER_TEMP/robot.jar" | sha256sum --check
          echo "ROBOT_JAR=$RUNNER_TEMP/robot.jar" >> "$GITHUB_ENV"

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Run validation suite
        env:
          GDPO_REQUIRE_ROBOT: "1"
        run: python validation/validate_suite.py

      - name: Check generated-file freshness and whitespace
        run: |
          git diff --check
          git diff --exit-code

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Build release assets
        run: python scripts/build_release.py
      - name: Publish tagged release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/gdpo-${GITHUB_REF_NAME}.zip"
          "dist/gdpo-${GITHUB_REF_NAME}.zip.sha256"
          "dist/release-manifest.json"
          --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
