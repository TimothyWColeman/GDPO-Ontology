<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Good Design Principles Ontology</title>
  <desc id="desc">A visual bridge from ten design principles through universally constrained prescribed process types to evaluation records with bounded traceability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09192c"/>
      <stop offset="0.55" stop-color="#123654"/>
      <stop offset="1" stop-color="#0c5b63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4b942"/>
      <stop offset="1" stop-color="#ffdf8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#020812" flood-opacity="0.32"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#b6dce1" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1600" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="460" rx="24" fill="url(#grid)"/>
  <circle cx="1420" cy="60" r="250" fill="#2aa6a4" opacity="0.08"/>
  <circle cx="1540" cy="400" r="300" fill="#f4b942" opacity="0.06"/>

  <g transform="translate(88 68)">
    <rect x="0" y="0" width="96" height="8" rx="4" fill="url(#accent)"/>
    <text x="0" y="72" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-1">Good Design Principles Ontology</text>
    <text x="0" y="119" fill="#b9d9e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Normative guidance · process prescriptions · evaluation traceability</text>
    <text x="0" y="166" fill="#f6ca68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2.5">GDPO 1.0 · BFO 2020 · CCO 2.0 · OWL 2 DL</text>
  </g>

  <g transform="translate(88 285)" filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g>
      <rect width="360" height="104" rx="16" fill="#ffffff" fill-opacity="0.96"/>
      <circle cx="50" cy="52" r="25" fill="#f4b942"/>
      <text x="50" y="60" text-anchor="middle" fill="#122a3f" font-size="24" font-weight="800">10</text>
      <text x="91" y="45" fill="#122a3f" font-size="18" font-weight="700">Principle categories</text>
      <text x="91" y="70" fill="#536a79" font-size="14">normative information content</text>
    </g>
    <path d="M372 52h54" stroke="#89bdc3" stroke-width="3"/>
    <path d="m421 45 10 7-10 7" fill="none" stroke="#89bdc3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(440)">
      <rect width="360" height="104" rx="16" fill="#ffffff" fill-opacity="0.96"/>
      <path d="M30 70c25-36 42-36 67 0" fill="none" stroke="#16858b" stroke-width="5" stroke-linecap="round"/>
      <circle cx="42" cy="49" r="8" fill="#16858b"/>
      <circle cx="84" cy="49" r="8" fill="#16858b"/>
      <text x="111" y="45" fill="#122a3f" font-size="18" font-weight="700">Process prescriptions</text>
      <text x="111" y="70" fill="#536a79" font-size="14">process types; occurrence not entailed</text>
    </g>
    <path d="M812 52h54" stroke="#89bdc3" stroke-width="3"/>
    <path d="m861 45 10 7-10 7" fill="none" stroke="#89bdc3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(880)">
      <rect width="520" height="104" rx="16" fill="#ffffff" fill-opacity="0.96"/>
      <rect x="29" y="27" width="52" height="50" rx="8" fill="#183d59"/>
      <path d="m42 51 9 9 18-22" fill="none" stroke="#ffcf64" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="103" y="45" fill="#122a3f" font-size="18" font-weight="700">Evaluation records</text>
      <text x="103" y="70" fill="#536a79" font-size="14">criterion · method · time · evidence · score</text>
      <g transform="translate(415 29)" fill="#16858b">
        <circle cx="0" cy="0" r="6"/><circle cx="30" cy="0" r="6"/><circle cx="60" cy="0" r="6"/>
        <circle cx="0" cy="23" r="6"/><circle cx="30" cy="23" r="6"/><circle cx="60" cy="23" r="6"/>
        <circle cx="0" cy="46" r="6"/><circle cx="30" cy="46" r="6"/><circle cx="60" cy="46" r="6"/>
      </g>
    </g>
  </g>
</svg>
