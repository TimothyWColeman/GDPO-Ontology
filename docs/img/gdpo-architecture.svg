<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GDPO semantic architecture</title>
  <desc id="desc">Four semantic layers connect normative design principles to artifact-associated targets, universally constrained prescribed process types, and evaluation records with bounded traceability.</desc>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c2138"/>
      <stop offset="1" stop-color="#0d666c"/>
    </linearGradient>
    <filter id="s" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#13293a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#45798a"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#f4f8f9"/>
  <rect width="1600" height="118" rx="24" fill="url(#head)"/>
  <rect y="94" width="1600" height="24" fill="url(#head)"/>
  <text x="70" y="57" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">GDPO semantic architecture</text>
  <text x="70" y="91" fill="#b9dce1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Keep the principle, its target, the prescribed process type, and the evaluation record distinct.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#s)">
    <g transform="translate(70 180)">
      <rect width="330" height="260" rx="18" fill="#fff" stroke="#e2b44f" stroke-width="3"/>
      <rect width="330" height="56" rx="16" fill="#f6c85f"/>
      <rect y="39" width="330" height="17" fill="#f6c85f"/>
      <text x="24" y="36" fill="#162e40" font-size="20" font-weight="800">NORMATIVE CONTENT</text>
      <text x="24" y="94" fill="#18384d" font-size="19" font-weight="700">Design principle</text>
      <text x="24" y="127" fill="#516a77" font-size="15">Normative ICE category</text>
      <text x="24" y="165" fill="#18384d" font-size="16">Canonical statement token</text>
      <text x="24" y="198" fill="#18384d" font-size="16">Prescription component</text>
      <path d="M24 220h282" stroke="#dbe5e8"/>
      <text x="24" y="244" fill="#6d7c84" font-size="13">not an artifact quality</text>
    </g>
    <g transform="translate(455 180)">
      <rect width="330" height="260" rx="18" fill="#fff" stroke="#4ab0ad" stroke-width="3"/>
      <rect width="330" height="56" rx="16" fill="#49b4b1"/>
      <rect y="39" width="330" height="17" fill="#49b4b1"/>
      <text x="24" y="36" fill="#fff" font-size="20" font-weight="800">ARTIFACT-SIDE TARGET</text>
      <text x="24" y="94" fill="#18384d" font-size="18" font-weight="700">OWL class expression</text>
      <text x="24" y="129" fill="#516a77" font-size="15">quality · function · disposition</text>
      <text x="24" y="160" fill="#516a77" font-size="15">material basis · communication</text>
      <rect x="24" y="188" width="282" height="42" rx="9" fill="#eaf7f6"/>
      <text x="165" y="214" text-anchor="middle" fill="#176b6d" font-size="13">universal target restriction</text>
      <text x="24" y="247" fill="#6d7c84" font-size="13">no dummy target individual</text>
    </g>
    <g transform="translate(840 180)">
      <rect width="330" height="260" rx="18" fill="#fff" stroke="#4c85a7" stroke-width="3"/>
      <rect width="330" height="56" rx="16" fill="#487f9f"/>
      <rect y="39" width="330" height="17" fill="#487f9f"/>
      <text x="24" y="36" fill="#fff" font-size="20" font-weight="800">DESIGN ACTIVITY</text>
      <text x="24" y="94" fill="#18384d" font-size="18" font-weight="700">Prescribed process type</text>
      <text x="24" y="129" fill="#516a77" font-size="15">innovation · use · comprehension</text>
      <text x="24" y="160" fill="#516a77" font-size="15">endurance · reduction · assurance</text>
      <rect x="24" y="188" width="282" height="42" rx="9" fill="#edf4f8"/>
      <text x="165" y="214" text-anchor="middle" fill="#315f7b" font-size="13">universal process restriction</text>
      <text x="24" y="247" fill="#6d7c84" font-size="13">occurrence not entailed</text>
    </g>
    <g transform="translate(1225 180)">
      <rect width="305" height="260" rx="18" fill="#fff" stroke="#755b9c" stroke-width="3"/>
      <rect width="305" height="56" rx="16" fill="#735b96"/>
      <rect y="39" width="305" height="17" fill="#735b96"/>
      <text x="24" y="36" fill="#fff" font-size="20" font-weight="800">EVALUATION</text>
      <text x="24" y="94" fill="#18384d" font-size="18" font-weight="700">Evaluation record</text>
      <text x="24" y="129" fill="#516a77" font-size="15">evaluated artifact · criterion</text>
      <text x="24" y="160" fill="#516a77" font-size="15">method · time · content · score</text>
      <rect x="24" y="188" width="257" height="42" rx="9" fill="#f2eff7"/>
      <text x="152" y="214" text-anchor="middle" fill="#604a82" font-size="13">evaluation-record ICE</text>
      <text x="24" y="247" fill="#6d7c84" font-size="13">not artifact or evaluation process</text>
    </g>
  </g>

  <g fill="none" stroke="#45798a" stroke-width="3" marker-end="url(#arrow)">
    <path d="M400 275h45"/>
    <path d="M785 275h45"/>
    <path d="M1170 275h45"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#466674" text-anchor="middle">
    <text x="422" y="258">aims at</text>
    <text x="807" y="258">prescribes only</text>
    <text x="1192" y="258">assesses</text>
  </g>

  <g transform="translate(70 510)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="0" fill="#17364a" font-size="23" font-weight="800">Reasoning and validation boundaries</text>
    <g transform="translate(0 36)">
      <rect width="1460" height="250" rx="18" fill="#fff" stroke="#d7e3e6"/>
      <g transform="translate(28 31)">
        <rect width="252" height="184" rx="14" fill="#edf6f7"/>
        <text x="20" y="38" fill="#176b6d" font-size="18" font-weight="800">OWL 2 DL</text>
        <text x="20" y="71" fill="#4e6874" font-size="14">category semantics</text>
        <text x="20" y="98" fill="#4e6874" font-size="14">necessary conditions</text>
        <text x="20" y="125" fill="#4e6874" font-size="14">property chains</text>
        <text x="20" y="160" fill="#176b6d" font-size="13">open-world claims</text>
      </g>
      <g transform="translate(312 31)">
        <rect width="252" height="184" rx="14" fill="#f3f0f8"/>
        <text x="20" y="38" fill="#654e87" font-size="18" font-weight="800">HermiT</text>
        <text x="20" y="71" fill="#4e6874" font-size="14">consistency</text>
        <text x="20" y="98" fill="#4e6874" font-size="14">classification</text>
        <text x="20" y="125" fill="#4e6874" font-size="14">unsatisfiable classes</text>
        <text x="20" y="151" fill="#4e6874" font-size="14">max-zero sentinel</text>
        <text x="20" y="174" fill="#654e87" font-size="13">DL reasoner evidence</text>
      </g>
      <g transform="translate(596 31)">
        <rect width="252" height="184" rx="14" fill="#fff6df"/>
        <text x="20" y="38" fill="#8a6619" font-size="18" font-weight="800">SHACL</text>
        <text x="20" y="71" fill="#4e6874" font-size="14">record completeness</text>
        <text x="20" y="98" fill="#4e6874" font-size="14">value-node constraints</text>
        <text x="20" y="125" fill="#4e6874" font-size="14">negative fixtures</text>
        <text x="20" y="160" fill="#8a6619" font-size="13">closed-world validation</text>
      </g>
      <g transform="translate(880 31)">
        <rect width="252" height="184" rx="14" fill="#edf3f8"/>
        <text x="20" y="38" fill="#315f7b" font-size="18" font-weight="800">SPARQL</text>
        <text x="20" y="71" fill="#4e6874" font-size="14">competency questions</text>
        <text x="20" y="98" fill="#4e6874" font-size="14">exact result contracts</text>
        <text x="20" y="125" fill="#4e6874" font-size="14">traceability views</text>
        <text x="20" y="160" fill="#315f7b" font-size="13">graph-dependent answers</text>
      </g>
      <g transform="translate(1164 31)">
        <rect width="268" height="184" rx="14" fill="#f4f5f5"/>
        <text x="20" y="38" fill="#3e515a" font-size="18" font-weight="800">Human review</text>
        <text x="20" y="71" fill="#4e6874" font-size="14">source interpretation</text>
        <text x="20" y="98" fill="#4e6874" font-size="14">model adequacy</text>
        <text x="20" y="125" fill="#4e6874" font-size="14">design judgment</text>
        <text x="20" y="160" fill="#3e515a" font-size="13">authoritative decisions</text>
      </g>
    </g>
  </g>
  <text x="70" y="850" fill="#667d88" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Automated conformance is bounded evidence; it is not a universal judgment that an artifact is good design.</text>
</svg>
